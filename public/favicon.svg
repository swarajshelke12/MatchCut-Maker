<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background rounded rect -->
  <rect width="32" height="32" rx="8" fill="#0d1b2a"/>
  <!-- Subtle gradient overlay -->
  <rect width="32" height="32" rx="8" fill="url(#bg-grad)" opacity="0.6"/>
  <!-- Scissors icon in brand teal (#00e5c0) -->
  <g stroke="#00e5c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top blade pivot circle -->
    <circle cx="10" cy="10.5" r="2.8"/>
    <!-- Bottom blade pivot circle -->
    <circle cx="10" cy="21.5" r="2.8"/>
    <!-- Top blade cutting line -->
    <line x1="12.5" y1="10.5" x2="24" y2="21.5"/>
    <!-- Bottom blade cutting line -->
    <line x1="12.5" y1="21.5" x2="18.25" y2="16"/>
    <!-- Handle lines -->
    <line x1="12.5" y1="10.5" x2="21" y2="10.5"/>
  </g>
  <!-- Glow dot accent -->
  <circle cx="23" cy="9.5" r="2" fill="#00e5c0" opacity="0.8"/>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2d40"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
  </defs>
</svg>
